version: '3.9'

services:
  redis:
    image: redis:latest
    container_name: redis-nest.js
    ports:
      - "6379:6379"
    networks:
      - redis-network
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

networks:
  redis-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
